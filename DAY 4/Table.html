<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>
            Tables
        </title>
    </head>
    <body>
        <table border = "Black">
            <caption>Menu</caption>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Cone</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Chocobar</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Icecream</td>
                <td>20</td>
            </tr>
        </table>


        <table border = "Black">
            <caption>
                Food Menu
            </caption>
            <thead>
                <tr>
                    <th rowspan = "2">Item</th>
                    <th colspan = "2">Price</th>
                </tr>
                <tr>
                    <th>IND</th>
                    <th>Dollars</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Frooti</td>
                    <td>20</td>
                    <td>0.20</td>
                </tr>
                <tr>
                    <td>Samosa</td>
                    <td>30</td>
                    <td>0.30</td>
                </tr>
                <tr>
                    <td>Icecream</td>
                    <td>50</td>
                    <td>0.50</td>
                </tr>
                <tr>
                    <td>Chips</td>
                    <td>40</td>
                    <td>0.40</td>
                </tr>
            </tbody>
        </table>





        <table border = "Black">
            <caption>A test table with merged cells</caption>
            <tr>
                <th rowspan = "2"></th>
                <th colspan = "2">Average</th>
                <th rowspan="2">Red eyes</th>
            </tr>
            <tr>
                <th>Height</th>
                <th>Weight</th>
            </tr>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
        </table>
    </body>
</html>
