<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <!-- Unordered list -->
     <ul>
        <li><h1>Sanket</h1></li>
        <li><h1>Jayesh</h1></li>
        <li><h1>Bhavesh</h1></li>
     </ul>
     <!-- Ordered list -->
      <ol type = "A">
        <li>Sanket</li>
        <li>Jayesh</li>
        <li>Bhavesh</li>
      </ol>
</body>
</html>

<!-- Attributes -->
<!-- They are used to add more information to the tag -->
<!-- eg  -->
 <ol type = "A">
 <html lang="en"> 
<!-- they can be writen in both single or double quote -->
<!-- here type lang is attribute and "A" "en" is there value -->
